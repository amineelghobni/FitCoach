name: Build & Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Generate config.local.h from secret
        shell: bash
        run: |
          cat > config.local.h << EOF
          #pragma once
          #define GROQ_API_KEY "${{ secrets.GROQ_API_KEY }}"
          EOF
      - name: Configure CMake
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Debug
      - name: Build application
        run: cmake --build build --target appFitCoach
      - name: Build tests
        run: cmake --build build --target tst_exerciseviewmodel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure