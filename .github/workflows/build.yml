name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          arch: 'win64_msvc2022_64'
          modules: 'qtquickcontrols2'
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build application
        run: cmake --build build --config Debug --target appFitCoach

      - name: Build tests
        run: cmake --build build --config Debug --target tst_exerciseviewmodel

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure